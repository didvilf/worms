<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fish Isles</title>
<style>
:root{--ink:#0b2a3b;--sea:#1d6f8f;--foam:#e9f6f1;--gold:#ffc83d;--red:#e0483e}
*{box-sizing:border-box;margin:0;font-family:"Trebuchet MS",Verdana,sans-serif}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--foam);user-select:none}
canvas{position:fixed;inset:0;image-rendering:pixelated}
.ui{position:fixed;inset:0;pointer-events:none}
.ui *{pointer-events:auto}
#menu{background:radial-gradient(circle at 50% 120%,#2aa6a0,var(--ink) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5;text-align:center}
#menu h1{font-size:clamp(40px,8vw,84px);letter-spacing:2px;color:var(--gold);text-shadow:4px 4px 0 #0007}
button{background:var(--gold);color:var(--ink);border:0;border-bottom:4px solid #b88a14;padding:10px 18px;font-size:16px;font-weight:700;cursor:pointer;border-radius:4px}
button:active{transform:translateY(2px)}button.s{background:#35657a;color:#fff;border-bottom-color:#1a3c4b}
input,select{padding:9px;font-size:16px;border-radius:4px;border:2px solid #35657a;background:#0d3347;color:#fff}
.sk{display:inline-block;width:34px;height:34px;border:3px solid #fff3;margin:3px;cursor:pointer}.sk.on{border-color:#fff}
#hud{display:none}
.bars{position:absolute;left:12px;top:12px;width:190px}
.b{height:14px;background:#0008;margin-bottom:5px;border:2px solid #000a}.b i{display:block;height:100%}
#top{position:absolute;right:12px;top:12px;text-align:right;text-shadow:2px 2px 0 #000;font-size:15px;line-height:1.5}
#tip{position:absolute;bottom:90px;width:100%;text-align:center;font-size:20px;text-shadow:2px 2px 0 #000;pointer-events:none}
#panel{display:none;background:#000a;z-index:4;align-items:center;justify-content:center}
#box{background:#0d3347;border:4px solid var(--gold);padding:18px;max-width:680px;width:94%;max-height:88vh;overflow:auto;border-radius:6px}
#box h2{color:var(--gold);margin-bottom:8px}#box .r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #fff2}
#box small{opacity:.7}
#tb{position:absolute;right:10px;bottom:12px;display:none;gap:8px}
#tb button{width:56px;height:56px;border-radius:50%;font-size:18px}
#boss{display:none;background:#200a;z-index:3}
.c{position:absolute;border-radius:50%;background:var(--red);border:4px solid #fff;cursor:pointer;animation:p 2s linear forwards}
@keyframes p{to{transform:scale(.3);opacity:.3}}
#res{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:6;font-size:min(10vw,70px);font-weight:900;text-shadow:4px 4px 0 #000;pointer-events:none;text-align:center}
.win{animation:w .6s ease 3}.lose{animation:l 1.4s ease forwards}
@keyframes w{50%{transform:scale(1.4) rotate(6deg);filter:hue-rotate(90deg)}}@keyframes l{to{transform:translateY(80px) scale(.1);opacity:0}}
#toast{position:fixed;top:60px;width:100%;text-align:center;font-size:20px;color:var(--gold);text-shadow:2px 2px 0 #000;pointer-events:none;z-index:7}
</style></head><body>
<div id="menu" class="ui">
 <h1>Fish Isles</h1>
 <div><input id="nm" maxlength="14" placeholder="Ник персонажа" value="Рыбак"></div>
 <div id="sks"></div>
 <button id="play">Играть</button><button class="s" id="sets">Настройки</button>
 <small id="nextrw"></small>
</div>
<div id="hud" class="ui">
 <div class="bars"><div class="b"><i id="hp" style="background:#e0483e"></i></div><div class="b"><i id="fd" style="background:#e8a23a"></i></div><div class="b"><i id="st" style="background:#4fc3f7"></i></div></div>
 <div id="top"></div><div id="tip"></div>
 <div id="tb"><button class="s" id="tF">F</button><button class="s" id="tE">E</button><button id="tA">⚔</button><button class="s" id="tR">⇧</button></div>
</div>
<div id="panel" class="ui"><div id="box"></div></div>
<div id="boss" class="ui"></div><div id="res"></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),T=THREE;
const FISH=[['Карась',5,40],['Плотва',8,30],['Окунь',14,22],['Щука',25,14],['Лосось',45,9],['Сом',80,6],['Тунец',140,4],['Скат',250,2.5],['Рыба-меч',450,1.5],['Мурена',800,.9],['Золотой карп',1500,.5],['Левиафан',4000,.2]];
const FP=Object.fromEntries(FISH.map(f=>[f[0],f[1]]));
const WORLDS=['Луга','Коралловый риф','Вулканы'],BOATS=[['Плот',0],['Лодка',300],['Катер',900],['Яхта',2500]];
const SKINS=['#e8b27a','#c68642','#f5d0a9','#8d5524','#9be37a','#7aa6e3'];
const ISL=[[0,0,26],[50,0,18],[-48,0,18]];
let S={name:'Рыбак',skin:SKINS[0],coins:60,xp:0,lvl:1,hp:100,mh:100,st:100,ms:100,fd:100,rod:[1,1,1],hpL:0,stL:0,boat:0,world:0,sword:0,armor:0,pick:0,axe:0,inv:{},wood:0,stone:0,caught:0,play:0,rw:[],qd:'',qn:0,vol:.5,fp:false,dev:'pc'};
try{Object.assign(S,JSON.parse(localStorage.fi||'{}'))}catch(e){}
const save=()=>{try{localStorage.fi=JSON.stringify(S)}catch(e){}};

/* ---------- audio ---------- */
let AC;function tone(f,d=.2,t='sine',dl=0){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;const n=AC.currentTime+dl;g.gain.setValueAtTime(.18*S.vol,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
const snd={ok:()=>[523,659,784].forEach((f,i)=>tone(f,.25,'sine',i*.08)),win:()=>[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.4,'triangle',i*.12)),bad:()=>[300,220,160].forEach((f,i)=>tone(f,.3,'sine',i*.12)),splash:()=>tone(180,.2,'triangle'),hit:()=>tone(120,.1,'square')};
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2200)}

/* ---------- three ---------- */
const R=new T.WebGLRenderer();R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);document.body.prepend(R.domElement);
const sc=new T.Scene(),cam=new T.PerspectiveCamera(70,innerWidth/innerHeight,.1,300);
const sun=new T.DirectionalLight(0xffffff,1),amb=new T.AmbientLight(0x99aacc,.6);sc.add(sun,amb);
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
function tex(a,b,rep){const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');for(let i=0;i<16;i++)for(let j=0;j<16;j++){x.fillStyle=Math.random()<.5?a:b;x.fillRect(i,j,1,1)}const t=new T.CanvasTexture(c);t.magFilter=t.minFilter=T.NearestFilter;t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rep,rep);return t}
const M=(a,b,r=1)=>new T.MeshLambertMaterial({map:tex(a,b,r)});
const mat={wood:M('#7a5230','#5e3d22'),leaf:M('#2f7d32','#3d9a40'),stone:M('#8a8f94','#6c7176'),gold:M('#ffc83d','#d99a1c'),shop:M('#b8473a','#d6604f'),cas:M('#6a3bb0','#8a58d0'),plank:M('#a97c4f','#8e6a40',4),mob:M('#e86f9a','#f08fb0'),bad:M('#3b7d3b','#254f25')};
const water=new T.Mesh(new T.PlaneGeometry(600,600),(()=>{const m=M('#2a7fc4','#3590d6',90);m.transparent=true;m.opacity=.85;return m})());water.rotation.x=-Math.PI/2;water.position.y=-.5;sc.add(water);
let G,objs=[],mobs=[];
const box=(w,h,d,m,x,y,z)=>{const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);G.add(o);return o};
function label(t,x,y,z){const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');g.font='bold 34px Trebuchet MS';g.textAlign='center';g.fillStyle='#fff';g.strokeStyle='#000';g.lineWidth=6;g.strokeText(t,128,44);g.fillText(t,128,44);const s=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c)}));s.scale.set(6,1.5,1);s.position.set(x,y,z);G.add(s)}
const inside=(x,z)=>ISL.some(([a,b,r])=>Math.hypot(x-a,z-b)<r-.5)||(Math.abs(z)<2.5&&Math.abs(x)<40);
function build(){if(G)sc.remove(G);G=new T.Group();sc.add(G);objs=[];mobs=[];const w=S.world;
 const gm=[M('#4f9d4a','#5fb257',8),M('#e0c47e','#d4b46a',8),M('#5a2b2b','#7a3a2a',8)][w];
 ISL.forEach(([x,z,r])=>{const m=new T.Mesh(new T.CylinderGeometry(r,r,3,20),gm);m.position.set(x,-1.5,z);G.add(m)});
 box(80,.3,5,mat.plank,0,-.1,0);
 const ob=(k,m,x,z,sy,h)=>{const o=box(sy,h,sy,m,x,h/2,z);objs.push({k,m:o,x,z,hp:3});return o};
 ob('shop',mat.shop,8,-8,5,4);label('Магазин',8,6,-8);ob('casino',mat.cas,-8,-8,5,4);label('Казино',-8,6,-8);
 box(4,.5,10,mat.plank,0,0,21);objs.push({k:'dock',x:0,z:23,m:null});label('Док (лодка)',0,3,24);
 box(3,1,5,mat.wood,0,-.2,27);
 const tree=(x,z)=>{ob('tree',mat.wood,x,z,.9,3);box(3,2.5,3,mat.leaf,x,4,z)};
 for(let i=0;i<5;i++)tree(-10+i*5,-20+(i%2)*3);
 const n=6+w*4;
 for(let i=0;i<n;i++){const a=i*2.4,r=4+i%12;tree(50+Math.cos(a)*r,Math.sin(a)*r)}
 for(let i=0;i<n;i++){const a=i*2.1,r=4+i%12;ob('rock',mat.stone,-48+Math.cos(a)*r,Math.sin(a)*r,1.6,1.4)}
 [[56,10],[44,-9],[-52,8],[-42,-10]].forEach(([x,z])=>{ob('chest',mat.gold,x,z,1.2,1)});
 for(let i=0;i<4;i++)addMob(false,-10+i*6,8+i);
 water.material.color.set(w==2?0xff8855:0xffffff)}
function addMob(bad,x,z){const o=new T.Mesh(new T.BoxGeometry(1.1,1,1.6),bad?mat.bad:mat.mob);o.position.set(x,.5,z);G.add(o);mobs.push({m:o,bad,hp:bad?20:10,a:Math.random()*6})}

/* ---------- player ---------- */
const pl=new T.Group();sc.add(pl);let P={x:0,z:10},yaw=0,face=[0,-1],K={},joy={x:0,y:0},run=false,modal=false,playing=false,T0=0;
function buildPlayer(){pl.clear();const b=(w,h,d,c,y)=>{const o=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshLambertMaterial({color:c}));o.position.y=y;pl.add(o)};
 b(.8,1,.5,0x2f6fd6,1.5);b(.3,.9,.3,0x333a66,.45);b(.5,.5,.5,S.skin,2.3);b(.55,.2,.55,0xffc83d,2.7);b(1,.2,.2,S.skin,1.8)}
const bob=new T.Mesh(new T.BoxGeometry(.4,.4,.4),new T.MeshBasicMaterial({color:0xff3030}));bob.visible=false;sc.add(bob);
let fs={s:0,t:0},jf=null,bonusT=0,day=.25;
function pickFish(){const wd=S.world,l=S.rod[1];const ws=FISH.map((f,i)=>f[2]*(i>=3?1+.25*(l-1):1)*(i>=2?1+.5*wd:1));let r=Math.random()*ws.reduce((a,b)=>a+b),i=0;while(r>ws[i]){r-=ws[i];i++}return FISH[i]}
function dist(o){return Math.hypot(o.x-P.x,o.z-P.z)}
function nearObj(){let b=null,bd=3.5;objs.forEach(o=>{if(o.gone)return;const d=dist(o);if(d<bd){bd=d;b=o}});return b}
function water_ahead(){const d=4;return!inside(P.x+face[0]*d,P.z+face[1]*d)}
function fish(){if(modal)return;
 if(fs.s==0){if(!water_ahead()){toast('Подойди к воде');return}fs={s:1,t:1.5+Math.random()*3};const d=4+S.rod[0]*2.5;bob.position.set(P.x+face[0]*d,0,P.z+face[1]*d);bob.visible=true;snd.splash();toast('Заброс…')}
 else if(fs.s==2){const f=pickFish();S.inv[f[0]]=(S.inv[f[0]]||0)+1;S.caught++;addXP(f[1]/2+5);snd.ok();toast('Поймал: '+f[0]+' ('+f[1]+' мон.)');jf={f,y:0,v:9,t:0,m:new T.Mesh(new T.BoxGeometry(.9,.3,.3),new T.MeshLambertMaterial({color:0xffa24a}))};jf.m.position.copy(bob.position);sc.add(jf.m);bonusT=1.6;fs.s=0;bob.visible=false;
  if(S.qd==new Date().toDateString()&&S.qn<5){S.qn++;if(S.qn==5){S.coins+=100;toast('Квест выполнен: +100 монет!')}}
  if(FISH.indexOf(f)>=9||Math.random()<.05)setTimeout(boss,1500)}
 else if(fs.s==1){fs.s=0;bob.visible=false}}
function addXP(x){S.xp+=x;while(S.xp>=S.lvl*50){S.xp-=S.lvl*50;S.lvl++;S.coins+=50;snd.win();toast('Уровень '+S.lvl+'! +50 монет')}}
function attack(){if(modal||!playing)return;
 if(jf&&bonusT>0&&S.sword>0){const v=Math.round(jf.f[1]*.5);S.coins+=v;bonusT=0;snd.hit();toast('Выстрел в рыбу! +'+v);sc.remove(jf.m);jf=null;return}
 snd.hit();const dmg=3+S.rod[2]*2+S.sword*8;
 mobs.forEach(m=>{if(Math.hypot(m.m.position.x-P.x,m.m.position.z-P.z)<3.5){m.hp-=dmg;if(m.hp<=0){G.remove(m.m);m.dead=1;if(m.bad){S.coins+=5*(S.world+1);addXP(8)}else S.fd=Math.min(100,S.fd+20)}}});mobs=mobs.filter(m=>!m.dead)}
function inter(){if(modal)return;const o=nearObj();if(!o)return;
 if(o.k=='shop')shop();else if(o.k=='casino')casino();else if(o.k=='dock')dock();
 else if(o.k=='tree'||o.k=='rock'){const t=o.k=='tree';const g=1+(t?S.axe:S.pick);if(t)S.wood+=g;else S.stone+=g;snd.hit();if(--o.hp<=0){o.gone=1;G.remove(o.m)}toast('+'+g+(t?' дерева':' камня'))}
 else if(o.k=='chest'){o.gone=1;G.remove(o.m);const r=Math.random();if(r<.4){const c=30*(S.world+1)+Math.floor(Math.random()*60);S.coins+=c;toast('Сундук: '+c+' монет')}else if(r<.7){S.armor++;toast('Сундук: броня! Защита +1')}else if(r<.85){S.wood+=5;S.stone+=5;toast('Сундук: ресурсы')}else{S.axe=Math.max(S.axe,1);S.pick=Math.max(S.pick,1);toast('Сундук: кирка и топор!')}snd.win()}}

/* ---------- panels ---------- */
function open(h){modal=true;$('box').innerHTML=h+'<p style="margin-top:12px"><button class="s" onclick="closeP()">Закрыть (Esc)</button></p>';$('panel').style.display='flex'}
function closeP(){modal=false;$('panel').style.display='none'}
const cost=(b,l)=>Math.round(b*Math.pow(1.6,l-1));
function shop(){const fv=Object.entries(S.inv).reduce((a,[k,n])=>a+FP[k]*n,0),n=Object.values(S.inv).reduce((a,b)=>a+b,0);
 const row=(t,s,c,f,ok=true)=>`<div class="r"><span>${t}<br><small>${s}</small></span><button ${ok?'':'disabled'} onclick="${f};shop()">${c}</button></div>`;
 open(`<h2>Магазин · 🪙 ${S.coins}</h2>`+row('Продать всю рыбу',n+' шт.',fv+' мон.',`sellAll()`,n>0)
 +row('Удочка: дальность '+S.rod[0],'Закидывать дальше',cost(40,S.rod[0]),`up('r',0)`,S.rod[0]<10)
 +row('Удочка: глубина/удача '+S.rod[1],'Более редкая рыба',cost(40,S.rod[1]),`up('r',1)`,S.rod[1]<10)
 +row('Удочка: урон '+S.rod[2],'Сильнее удар',cost(40,S.rod[2]),`up('r',2)`,S.rod[2]<10)
 +row('Здоровье '+(100+S.hpL*20),'+20 макс. HP',cost(60,S.hpL+1),`up('h')`,S.hpL<8)
 +row('Выносливость '+(100+S.stL*20),'+20 макс.',cost(60,S.stL+1),`up('s')`,S.stL<8)
 +row('Меч '+S.sword,'Урон +8, убийство рыбы в воздухе',cost(150,S.sword+1),`up('w')`,S.sword<5)
 +BOATS.map((b,i)=>i&&i>S.boat?row(b[0],'Скорость и доступ к мирам',b[1],`up('b',${i})`,i==S.boat+1):'').join('')
 +`<h2 style="margin-top:12px">Крафт · дерево ${S.wood} · камень ${S.stone}</h2>`
 +row('Кирка '+S.pick,'Камня за раз +1','5 🪵 3 🪨',`craft('pick',5,3)`,S.wood>=5&&S.stone>=3&&S.pick<3)
 +row('Топор '+S.axe,'Дерева за раз +1','3 🪵 2 🪨',`craft('axe',3,2)`,S.wood>=3&&S.stone>=2&&S.axe<3)
 +row('Меч (крафт)','Урон +8','4 🪵 6 🪨',`craft('sword',4,6)`,S.wood>=4&&S.stone>=6&&S.sword<5))}
function sellAll(){let v=0;for(const k in S.inv)v+=FP[k]*S.inv[k];S.inv={};S.coins+=v;snd.ok();toast('+'+v+' монет')}
function pay(c){if(S.coins<c){snd.bad();return false}S.coins-=c;snd.ok();return true}
function up(k,i){if(k=='r'&&pay(cost(40,S.rod[i])))S.rod[i]++;if(k=='h'&&pay(cost(60,S.hpL+1))){S.hpL++;S.mh+=20}if(k=='s'&&pay(cost(60,S.stL+1))){S.stL++;S.ms+=20}if(k=='w'&&pay(cost(150,S.sword+1)))S.sword++;if(k=='b'&&pay(BOATS[i][1]))S.boat=i}
function craft(k,w,s){S.wood-=w;S.stone-=s;S[k]++;snd.ok()}
function dock(){open(`<h2>Док · лодка: ${BOATS[S.boat][0]}</h2>`+WORLDS.map((n,i)=>`<div class="r"><span>Мир: ${n}<br><small>${i?'Больше и лучше ресурсов, редкая рыба':'Стартовый'}</small></span><button ${i<=S.boat&&i!=S.world?'':'disabled'} onclick="sail(${i})">${i==S.world?'Здесь':i<=S.boat?'Плыть':'Нужна лодка лучше'}</button></div>`).join(''))}
function sail(i){closeP();const t=3500/(1+S.boat*.7);$('res').style.display='flex';$('res').textContent='⛵ Плывём…';setTimeout(()=>{S.world=i;build();P={x:0,z:10};$('res').style.display='none'},t)}

/* ---------- casino ---------- */
let bet={};
function casino(){const tot=Object.values(bet).reduce((a,b)=>a+b,0),v=Object.entries(bet).reduce((a,[k,n])=>a+FP[k]*n,0);
 open(`<h2>Казино</h2><small>Ставь до 10 рыб любых видов. Красное/чёрное ×2 · зелёное ×30 · белое ×50</small>`
 +Object.entries(S.inv).filter(a=>a[1]>0).map(([k,n])=>`<div class="r"><span>${k} ×${n}</span><span><button class="s" onclick="cb('${k}',-1)">−</button> ${bet[k]||0} <button class="s" onclick="cb('${k}',1)">+</button></span></div>`).join('')||'<p>Нет рыбы</p>'
 +`<p style="margin:10px 0">Ставка: ${tot}/10 рыб · стоимость ${v} мон.</p>`
 +['red:Красное:#e0483e','black:Чёрное:#222','green:Зелёное:#2fa84f','white:Белое:#eee'].map(s=>{const[a,b,c]=s.split(':');return`<button ${tot?'':'disabled'} style="background:${c};color:${a=='white'?'#000':'#fff'}" onclick="spin('${a}')">${b}</button> `}).join(''))}
function cb(k,d){const t=Object.values(bet).reduce((a,b)=>a+b,0),n=(bet[k]||0)+d;if(n<0||n>S.inv[k]||(d>0&&t>=10))return;bet[k]=n;casino()}
function spin(c){const v=Object.entries(bet).reduce((a,[k,n])=>a+FP[k]*n,0);let r=Math.random()*90,res=r<42?'red':r<84?'black':r<89?'green':'white';
 for(const k in bet){S.inv[k]-=bet[k]}bet={};closeP();const e=$('res');e.className='';e.style.display='flex';
 const nm={red:'Красное',black:'Чёрное',green:'Зелёное',white:'Белое'}[res],col={red:'#e0483e',black:'#aaa',green:'#3fe06f',white:'#fff'}[res];e.style.color=col;
 if(res==c){const m=res=='green'?30:res=='white'?50:2;S.coins+=v*m;e.textContent=nm+'! ×'+m+' 🪙 '+v*m;e.className='win';snd[m>2?'win':'ok']()}
 else{e.textContent=nm+'… рыба исчезла 🐟✨';e.className='lose';snd.bad()}
 setTimeout(()=>e.style.display='none',2600)}

/* ---------- boss ---------- */
function boss(){if(modal)return;modal=true;const B=$('boss');B.style.display='block';B.innerHTML='<h2 style="text-align:center;padding:20px;color:#ffc83d" id="bt">БОСС! Жми на круги</h2>';let hits=0,t=30,id;
 const tick=setInterval(()=>{t-=.6;$('bt').textContent='БОСС! Попаданий: '+hits+' · '+Math.ceil(t)+' с';const c=document.createElement('div'),s=44+Math.random()*30;c.className='c';c.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*(innerWidth-s)}px;top:${80+Math.random()*(innerHeight-s-100)}px`;c.onpointerdown=()=>{hits++;snd.hit();c.remove()};B.appendChild(c);setTimeout(()=>c.remove(),2000);
  if(t<=0){clearInterval(tick);const r=hits*12*(S.world+1);S.coins+=r;B.style.display='none';modal=false;snd.win();toast('Босс побеждён! '+hits+' попаданий = '+r+' монет')}},600)}

/* ---------- menu & settings ---------- */
$('sks').innerHTML=SKINS.map(c=>`<span class="sk ${c==S.skin?'on':''}" style="background:${c}" onclick="S.skin='${c}';document.querySelectorAll('.sk').forEach(e=>e.classList.toggle('on',e.style.background==this.style.background))"></span>`).join('');
$('nm').value=S.name;
function settings(){open(`<h2>Настройки</h2><div class="r">Громкость <input type="range" min="0" max="1" step=".05" value="${S.vol}" oninput="S.vol=+this.value"></div><div class="r">Вид от первого лица (V) <input type="checkbox" ${S.fp?'checked':''} onchange="S.fp=this.checked"></div><div class="r">Устройство <select onchange="S.dev=this.value;dev()"><option value="pc" ${S.dev=='pc'?'selected':''}>ПК</option><option value="phone" ${S.dev=='phone'?'selected':''}>Телефон</option><option value="tablet" ${S.dev=='tablet'?'selected':''}>Планшет</option></select></div><small>ПК: WASD, Shift бег, F рыбалка, E действие, Пробел/клик удар, ЛКМ-тяни — камера</small>`)}
function dev(){$('tb').style.display=S.dev=='pc'?'none':'flex'}
$('sets').onclick=settings;
const RW=[[1800,150,'30 мин'],[3600,350,'1 час'],[7200,800,'2 часа'],[14400,2000,'4 часа']];
function nr(){const r=RW.find(r=>!S.rw.includes(r[0]));$('nextrw').textContent=r?`Награда за ${r[2]} игры: ${r[1]} монет (сыграно ${Math.floor(S.play/60)} мин)`:'Все награды за время получены'}nr();
$('play').onclick=()=>{S.name=$('nm').value||'Рыбак';$('menu').style.display='none';$('hud').style.display='block';playing=true;buildPlayer();build();dev();const d=new Date().toDateString();if(S.qd!=d){S.qd=d;S.qn=0}try{AC=AC||new AudioContext()}catch(e){}loop()};

/* ---------- input ---------- */
addEventListener('keydown',e=>{K[e.code]=1;if(!playing)return;if(e.code=='Escape'){modal?closeP():settings()}if(e.code=='KeyF')fish();if(e.code=='KeyE')inter();if(e.code=='KeyV')S.fp=!S.fp;if(e.code=='Space'){attack();e.preventDefault()}});
addEventListener('keyup',e=>K[e.code]=0);
let drag=0,lx=0,ox=0,oy=0;
R.domElement.addEventListener('pointerdown',e=>{if(e.clientX<innerWidth/2&&e.pointerType=='touch'){ox=e.clientX;oy=e.clientY;joy.id=e.pointerId}else{drag=1;lx=e.clientX;attack()}});
addEventListener('pointermove',e=>{if(e.pointerId==joy.id){joy.x=Math.max(-1,Math.min(1,(e.clientX-ox)/50));joy.y=Math.max(-1,Math.min(1,(e.clientY-oy)/50))}else if(drag){yaw-=(e.clientX-lx)*.008;lx=e.clientX}});
addEventListener('pointerup',e=>{drag=0;if(e.pointerId==joy.id){joy.x=joy.y=0;joy.id=null}});
$('tF').onclick=fish;$('tE').onclick=inter;$('tA').onclick=attack;$('tR').onclick=()=>run=!run;

/* ---------- loop ---------- */
let last=performance.now(),acc=0;
function loop(){requestAnimationFrame(loop);const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;if(!playing)return;
 S.play+=dt;RW.forEach(r=>{if(S.play>=r[0]&&!S.rw.includes(r[0])){S.rw.push(r[0]);S.coins+=r[1];toast('Награда за '+r[2]+': '+r[1]+' монет!');snd.win()}});
 day=(day+dt/150)%1;const sh=Math.sin(day*Math.PI*2),dl=Math.max(0,sh);
 const sky=new T.Color(0x070b22).lerp(new T.Color(0x87ceeb),Math.min(1,dl*1.6));sc.background=sky;sc.fog=new T.Fog(sky,50,170);amb.intensity=.25+.5*dl;sun.intensity=.15+.9*dl;sun.position.set(Math.cos(day*6.28)*60,Math.abs(sh)*60+10,20);
 const night=sh<-.1;
 if(!modal){let mx=(K.KeyD||0)-(K.KeyA||0)+joy.x,mz=(K.KeyS||0)-(K.KeyW||0)+joy.y;const l=Math.hypot(mx,mz),canRun=(K.ShiftLeft||run)&&S.st>1;
  if(l>.1){if(l>1){mx/=l;mz/=l}const sp=(canRun?8:4.5),c=Math.cos(yaw),s=Math.sin(yaw),dx=(mx*c+mz*s)*sp*dt,dz=(-mx*s+mz*c)*sp*dt;
   if(inside(P.x+dx,P.z+dz)){P.x+=dx;P.z+=dz}else if(inside(P.x+dx,P.z))P.x+=dx;else if(inside(P.x,P.z+dz))P.z+=dz;
   const n=Math.hypot(dx,dz);if(n>0){face=[dx/n,dz/n];pl.rotation.y=Math.atan2(dx,dz)}if(canRun)S.st=Math.max(0,S.st-18*dt)}
  if(!(l>.1&&canRun))S.st=Math.min(S.ms,S.st+14*dt);
  if(K.ArrowLeft)yaw+=dt*2;if(K.ArrowRight)yaw-=dt*2;
  S.fd-=dt*.25;if(S.fd<=0){S.fd=0;S.hp-=dt*2}else if(S.hp<S.mh)S.hp=Math.min(S.mh,S.hp+dt*.8);
  if(fs.s==1){fs.t-=dt;if(fs.t<=0){fs={s:2,t:1.6};toast('Клюёт! Жми F');snd.splash()}}else if(fs.s==2){fs.t-=dt;bob.position.y=-.1+Math.sin(now/60)*.15;if(fs.t<=0){fs.s=0;bob.visible=false;toast('Сорвалась…')}}
  if(night&&mobs.filter(m=>m.bad).length<4&&Math.random()<dt){const a=Math.random()*6.28;const x=P.x+Math.cos(a)*18,z=P.z+Math.sin(a)*18;if(inside(x,z))addMob(true,x,z)}
  if(!night)mobs.filter(m=>m.bad).forEach(m=>{G.remove(m.m);m.dead=1});
  mobs=mobs.filter(m=>!m.dead);
  mobs.forEach(m=>{const p=m.m.position;if(m.bad){const d=Math.hypot(P.x-p.x,P.z-p.z);if(d<22){const nx=p.x+(P.x-p.x)/d*2.5*dt,nz=p.z+(P.z-p.z)/d*2.5*dt;if(inside(nx,nz)){p.x=nx;p.z=nz}}if(d<1.6)S.hp-=10*dt/(1+S.armor*.25)}else{m.a+=dt*.3;const nx=p.x+Math.cos(m.a)*dt,nz=p.z+Math.sin(m.a)*dt;if(inside(nx,nz)){p.x=nx;p.z=nz}else m.a+=2}});
  if(S.hp<=0){S.hp=S.mh;S.fd=60;S.coins=Math.floor(S.coins*.9);P={x:0,z:10};toast('Ты потерял сознание: −10% монет')}}
 if(jf){jf.v-=22*dt;jf.m.position.y+=jf.v*dt;jf.m.rotation.z+=dt*8;bonusT-=dt;if(jf.m.position.y<-.3){sc.remove(jf.m);jf=null}}
 pl.position.set(P.x,0,P.z);pl.visible=!S.fp;
 const d=S.fp?.1:9;if(S.fp)cam.position.set(P.x,2.4,P.z);else cam.position.set(P.x+Math.sin(yaw)*d,5.5,P.z+Math.cos(yaw)*d);cam.lookAt(S.fp?P.x-Math.sin(yaw)*5:P.x,S.fp?2.3:2,S.fp?P.z-Math.cos(yaw)*5:P.z);
 water.material.map.offset.x+=dt*.002;
 const o=nearObj();$('tip').textContent=modal?'':fs.s==2?'🎣 Клюёт! F':o?({shop:'E — Магазин',casino:'E — Казино',dock:'E — Лодка',tree:'E — Рубить',rock:'E — Добывать',chest:'E — Открыть сундук'})[o.k]:water_ahead()&&fs.s==0?'F — Рыбачить':'';
 $('hp').style.width=S.hp/S.mh*100+'%';$('fd').style.width=S.fd+'%';$('st').style.width=S.st/S.ms*100+'%';
 const tm=Math.floor(day*24);$('top').innerHTML=`${S.name} · ур. ${S.lvl}<br>🪙 ${S.coins} · 🪵 ${S.wood} · 🪨 ${S.stone}<br>🕐 ${String(tm).padStart(2,'0')}:00 ${night?'🌙':'☀️'} · ${WORLDS[S.world]}<br>Квест: рыб ${S.qn}/5 (+100)`;
 acc+=dt;if(acc>10){acc=0;save()}R.render(sc,cam)}
</script></body></html>
